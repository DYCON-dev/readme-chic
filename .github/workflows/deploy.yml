name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only deploy when the maintainer has explicitly opted in by setting
    # the CF_DEPLOY_ENABLED repository variable to "true" (Settings ->
    # Secrets and variables -> Actions -> Variables tab). This keeps the
    # job from failing for forks and for the maintainer until the
    # CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are ready.
    if: ${{ vars.CF_DEPLOY_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
